services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: exam-generator-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: exam
      POSTGRES_USER: exam
      POSTGRES_PASSWORD: exam
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/init.sql:/docker-entrypoint-initdb.d/001_init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U exam -d exam"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - exam-generator-net

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.13.4
    container_name: exam-generator-elasticsearch
    restart: unless-stopped
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      # RAM
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
      # Elasticvue
      http.cors.enabled: "true"
      http.cors.allow-origin: "http://localhost:8088"
      http.cors.allow-headers: "X-Requested-With,Content-Type,Content-Length,Authorization"
      http.cors.allow-methods: "OPTIONS,HEAD,GET,POST,PUT,DELETE"
    ports:
      - "9200:9200"
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9200 >/dev/null || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 30
    ulimits:
      memlock:
        soft: -1
        hard: -1
    mem_limit: 1g
    networks:
      - exam-generator-net

  elasticvue:
    image: cars10/elasticvue:latest
    container_name: exam-generator-elasticvue
    restart: unless-stopped
    ports:
      - "8088:8080"
    depends_on:
      elasticsearch:
        condition: service_healthy
    networks:
      - exam-generator-net
volumes:
  postgres-data:
  elasticsearch-data:

networks:
  exam-generator-net:
    driver: bridge