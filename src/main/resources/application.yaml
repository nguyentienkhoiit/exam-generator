server:
  port: ${SERVER_PORT:8080}
  tomcat:
    max-swallow-size: -1

spring:
  autoconfigure:
    exclude:
      - org.springframework.ai.model.openai.autoconfigure.OpenAiEmbeddingAutoConfiguration
  application:
    name: exam-generator
  servlet:
    multipart:
      enabled: true
      max-file-size: 100MB
      max-request-size: 100MB

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:${POSTGRES_PORT:5432}/${POSTGRES_DB:exam}}
    username: ${SPRING_DATASOURCE_USERNAME:${POSTGRES_USER:exam}}
    password: ${SPRING_DATASOURCE_PASSWORD:${POSTGRES_PASSWORD:exam}}
    hikari:
      maximum-pool-size: ${DB_POOL_MAX:10}
      minimum-idle: ${DB_POOL_MIN:2}
      connection-timeout: ${DB_POOL_CONN_TIMEOUT_MS:2000}
      validation-timeout: ${DB_POOL_VALID_TIMEOUT_MS:1000}
      idle-timeout: ${DB_POOL_IDLE_TIMEOUT_MS:300000}
      max-lifetime: ${DB_POOL_MAX_LIFETIME_MS:1800000}

  ai:
    vectorstore:
      pgvector:
        table-name: vector_store
        schema-validation: false
        initialize-schema: false

    ollama:
      base-url: ${OLLAMA_BASE_URL:http://localhost:${OLLAMA_PORT:11434}}
      embedding:
        model: ${OLLAMA_EMBEDDING_MODEL:nomic-embed-text}

    openai:
      api-key: ${DEEPSEEK_API_KEY:sk-b3447cc3c4404a09a36c3b252f5e054a}
      base-url: ${DEEPSEEK_BASE_URL:https://api.deepseek.com}
      connect-timeout: ${OPENAI_CONNECT_TIMEOUT:30s}
      read-timeout: ${OPENAI_READ_TIMEOUT:300s}
      chat:
        options:
          model: ${DEEPSEEK_MODEL:deepseek-chat}
          max-tokens: ${DEEPSEEK_MAX_TOKENS:5000}
          temperature: ${DEEPSEEK_TEMPERATURE:0.2}

logging:
  level:
    root: INFO
    com.khoinguyen.exam: INFO

exam:
  elasticsearch:
    url: ${ELASTIC_URL:http://localhost:${ELASTIC_PORT:9200}}
    index: ${ELASTIC_INDEX:rag_chunks}
    connect-timeout-ms: ${ELASTIC_CONNECT_TIMEOUT_MS:1000}
    socket-timeout-ms: ${ELASTIC_SOCKET_TIMEOUT_MS:3000}

  pgvector:
    dimensions: ${PGVECTOR_DIMENSIONS:768}

  ingest:
    cache:
      enabled: ${INGEST_CACHE_ENABLED:true}

  rag:
    chunk:
      tokens: ${RAG_CHUNK_TOKENS:300}
      overlap: ${RAG_CHUNK_OVERLAP:40}
      min-chars: ${RAG_CHUNK_MIN_CHARS:180}

    retrieve:
      topK: ${RAG_TOPK:12}
      alpha: ${RAG_ALPHA:0.6}
      mmr:
        lambda: ${RAG_MMR_LAMBDA:0.7}
        k: ${RAG_MMR_K:8}

    context:
      max-chars: ${RAG_CONTEXT_MAX_CHARS:6500}
      max-chunks: ${RAG_CONTEXT_MAX_CHUNKS:8}